<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Profit Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse & Wave Animations -->
    <style>
      .pulse-gold {
        animation: pulseGoldAnim 3s infinite ease-in-out;
      }
      @keyframes pulseGoldAnim {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      .chart-line {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLineAnim 4s ease-out forwards infinite alternate;
      }
      @keyframes drawLineAnim {
        0% { stroke-dashoffset: 400; }
        60%, 100% { stroke-dashoffset: 0; }
      }

      .pulse-dot {
        animation: pulseDotAnim 2s infinite ease-in-out;
      }
      @keyframes pulseDotAnim {
        0%, 100% { r: 5; opacity: 1; }
        50% { r: 7.5; opacity: 0.7; }
      }

      .bar-anim-1 { animation: growBar1 3s ease-in-out infinite alternate; }
      .bar-anim-2 { animation: growBar2 3s ease-in-out infinite alternate; }
      .bar-anim-3 { animation: growBar3 3s ease-in-out infinite alternate; }
      @keyframes growBar1 { 0% { height: 20px; y: 220px; } 100% { height: 50px; y: 190px; } }
      @keyframes growBar2 { 0% { height: 40px; y: 200px; } 100% { height: 75px; y: 165px; } }
      @keyframes growBar3 { 0% { height: 30px; y: 210px; } 100% { height: 60px; y: 180px; } }

      .glow-border {
        animation: borderGlow 4s infinite alternate;
      }
      @keyframes borderGlow {
        0% { stroke: #475569; }
        50% { stroke: #f59e0b; }
        100% { stroke: #10b981; }
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" />
  <rect class="glow-border" x="2" y="2" width="956" height="316" rx="14" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
  </g>

  <!-- Brand Group -->
  <g transform="translate(48, 50)">
    <!-- Logo Symbol -->
    <circle cx="28" cy="28" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 18 36 L 28 16 L 38 36 Z M 23 29 L 33 29" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linejoin="round" />
    <circle cx="28" cy="28" r="4" fill="#10b981" filter="url(#glowGreen)" />

    <!-- Title and Slogan -->
    <text x="74" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#goldGrad)" letter-spacing="1">
      SPREADPROFIT
    </text>
    <text x="74" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Precious Metals &amp; Multi-Asset Portfolio Tracker • Moving Average Cost Basis Engine
    </text>
  </g>

  <!-- Live KPI Cards -->
  <!-- Card 1: Total Invested -->
  <g transform="translate(48, 128)">
    <rect width="180" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">
      TOTAL INVESTED
    </text>
    <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      320.5M đ
    </text>
  </g>

  <!-- Card 2: Current Valuation -->
  <g transform="translate(244, 128)">
    <rect width="180" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">
      CURRENT VALUATION
    </text>
    <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fbbf24">
      384.2M đ
    </text>
  </g>

  <!-- Card 3: Unrealized PnL (Glowing) -->
  <g transform="translate(440, 128)">
    <rect width="200" height="74" rx="8" fill="#132c20" stroke="#10b981" stroke-width="1.5" />
    <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">
      UNREALIZED NET PnL
    </text>
    <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#34d399">
      +63.7M đ (+19.87%)
    </text>
  </g>

  <!-- Mini Animated Visual Chart Area -->
  <g transform="translate(680, 100)">
    <rect width="232" height="152" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#818cf8">
      Real-Time Performance
    </text>

    <!-- Mini Bar Chart -->
    <rect class="bar-anim-1" x="24" y="190" width="12" height="50" rx="3" fill="#64748b" transform="translate(0, -90)" />
    <rect class="bar-anim-2" x="42" y="165" width="12" height="75" rx="3" fill="#f59e0b" transform="translate(0, -90)" />
    <rect class="bar-anim-3" x="60" y="180" width="12" height="60" rx="3" fill="#10b981" transform="translate(0, -90)" />

    <!-- Animated Trend Line -->
    <path class="chart-line" d="M 85 110 Q 120 95, 145 75 T 195 50 T 215 42" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Glowing End Dot -->
    <circle class="pulse-dot" cx="215" cy="42" r="5" fill="#34d399" filter="url(#glowGreen)" />
  </g>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(48, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="15" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🛡️ 100% Offline-First</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="170" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚖️ Moving Cost Basis</text>

    <!-- Pill 3 -->
    <rect x="320" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="335" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🔄 Lượng • Chỉ • Oz</text>

    <!-- Pill 4 -->
    <rect x="480" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="495" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">☁️ Google Cloud Sync</text>
  </g>
</svg>
